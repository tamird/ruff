[package]
name = "ty_starlark"
version = "0.0.0"
publish = false
description = "Bazel and host graph Starlark source checks for Sty"
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true

[lib]
doctest = false

[dependencies]
ruff_db = { workspace = true }
ruff_memory_usage = { workspace = true }
ruff_python_ast = { workspace = true, features = ["get-size"] }
ruff_python_parser = { workspace = true }
ruff_source_file = { workspace = true }
ruff_text_size = { workspace = true, features = ["get-size"] }

ty_module_resolver = { workspace = true }
ty_python_core = { workspace = true }
ty_python_semantic = { workspace = true }

anyhow = { workspace = true }
get-size2 = { workspace = true }
salsa = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
ruff_db = { workspace = true, features = ["testing"] }

[lints]
workspace = true
